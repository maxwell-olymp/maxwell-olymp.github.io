theme: "just-the-docs"

title: Олимпиада им. Дж. Кл. Максвелла
description: >-
  Олимпиада по физике им. Дж. Кл. Максвелла для учеников 7-8 классов —
  замена регионального и заключительного этапов Всероссийской олимпиады
  школьников по физике.

color_scheme: maxwell
logo: "/assets/images/maxwell-logo.png"

mermaid:
  version: "11.16.0"

collections:
  news:
    output: true
    permalink: /news/:name/

defaults:
  - scope:
      path: ""
    values:
      has_toc: false
  - scope:
      path: ""
      type: news
    values:
      layout: news
